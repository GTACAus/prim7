<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Big Kahuna 3 - Build Your Experiment</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="../styles/build_style.css" rel="stylesheet" type="text/css">
  <link href="../styles/lesson2_styles/lesson2.css" rel="stylesheet" type="text/css">
  <link href="../styles/lesson2_styles/bigkahuna3.css" rel="stylesheet" type="text/css">
</head>
<body>
  <main class="bk3-page">
    <div class="bk3-progress" aria-label="Investigation progress">
      <div class="bk3-progress-step active" data-progress-step="0">1. Change</div>
      <div class="bk3-progress-step" data-progress-step="1">2. Measure</div>
      <div class="bk3-progress-step" data-progress-step="2">3. Control</div>
      <div class="bk3-progress-step" data-progress-step="3">4. Blueprint</div>
    </div>

    <div class="bk3-layout">
      <aside class="bk3-panel bk3-diagram-panel">
        <div class="bk3-diagram-heading">
          <h2>Your experiment</h2>
          <div class="bk3-diagram-status" id="diagramStatus">Start by choosing what you will change.</div>
        </div>

        <div class="bk3-diagram-wrap">
          <svg class="bk3-diagram" viewBox="0 0 620 520" role="img" aria-labelledby="diagramTitle diagramDescription">
            <title id="diagramTitle">Bouncing ball investigation</title>
            <desc id="diagramDescription">A polished side-view science illustration showing a ball dropped beside a labelled ruler, its motion path, bounce height, and a changeable testing surface.</desc>

            <defs>
              <linearGradient id="wallGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fffdf4"></stop>
                <stop offset="100%" stop-color="#f5f1df"></stop>
              </linearGradient>
              <linearGradient id="ballGradient" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
                <stop offset="0%" stop-color="#ffe57d"></stop>
                <stop offset="55%" stop-color="#ffc91c"></stop>
                <stop offset="100%" stop-color="#e9a900"></stop>
              </linearGradient>
              <linearGradient id="surfaceGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#8af0d3"></stop>
                <stop offset="100%" stop-color="#4ed3ad"></stop>
              </linearGradient>
              <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#30332f" flood-opacity="0.18"></feDropShadow>
              </filter>
              <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#30332f" flood-opacity="0.16"></feDropShadow>
              </filter>
              <pattern id="concretePattern" width="28" height="22" patternUnits="userSpaceOnUse">
                <rect width="28" height="22" fill="#c7cbce"></rect>
                <circle cx="6" cy="7" r="1.5" fill="#9ea4a8"></circle>
                <circle cx="20" cy="14" r="1.2" fill="#aab0b3"></circle>
                <path d="M2 18 L10 16 M17 4 L25 6" stroke="#b2b7ba" stroke-width="1"></path>
              </pattern>
              <pattern id="carpetPattern" width="12" height="12" patternUnits="userSpaceOnUse">
                <rect width="12" height="12" fill="#ded7ff"></rect>
                <path d="M0 3 H12 M0 9 H12" stroke="#b8a4ff" stroke-width="1.3"></path>
              </pattern>
              <pattern id="grassPattern" width="18" height="18" patternUnits="userSpaceOnUse">
                <rect width="18" height="18" fill="#a9e2a3"></rect>
                <path d="M3 16 L6 7 M8 17 L10 5 M13 17 L15 9" stroke="#5da95f" stroke-width="1.8" stroke-linecap="round"></path>
              </pattern>
            </defs>

            <!-- Room and grounded scene -->
            <rect x="10" y="10" width="600" height="500" rx="26" fill="url(#wallGradient)" stroke="#30332f" stroke-width="3"></rect>
            <path d="M28 428 H592 V486 Q592 492 586 492 H34 Q28 492 28 486 Z" fill="#e8e1cb"></path>
            <line x1="28" y1="428" x2="592" y2="428" stroke="#30332f" stroke-width="3"></line>
            <ellipse class="bk3-floor-shadow" cx="315" cy="444" rx="150" ry="18"></ellipse>

            <!-- Drop-height apparatus -->
            <g class="bk3-diagram-part" data-part="drop">
              <rect x="58" y="62" width="70" height="330" rx="10" fill="#fff5bd" stroke="#30332f" stroke-width="4" filter="url(#smallShadow)"></rect>
              <rect x="67" y="72" width="52" height="310" rx="5" fill="#fffdf4" stroke="#30332f" stroke-width="2"></rect>
              <g stroke="#30332f" stroke-width="2.4">
                <line x1="88" y1="92" x2="118" y2="92"></line>
                <line x1="98" y1="117" x2="118" y2="117"></line>
                <line x1="88" y1="142" x2="118" y2="142"></line>
                <line x1="98" y1="167" x2="118" y2="167"></line>
                <line x1="88" y1="192" x2="118" y2="192"></line>
                <line x1="98" y1="217" x2="118" y2="217"></line>
                <line x1="88" y1="242" x2="118" y2="242"></line>
                <line x1="98" y1="267" x2="118" y2="267"></line>
                <line x1="88" y1="292" x2="118" y2="292"></line>
                <line x1="98" y1="317" x2="118" y2="317"></line>
                <line x1="88" y1="342" x2="118" y2="342"></line>
                <line x1="98" y1="367" x2="118" y2="367"></line>
              </g>
              <g class="bk3-scene-label" font-size="13" text-anchor="end">
                <text x="84" y="97">150</text>
                <text x="84" y="147">125</text>
                <text x="84" y="197">100</text>
                <text x="84" y="247">75</text>
                <text x="84" y="297">50</text>
                <text x="84" y="347">25</text>
              </g>
              <text x="93" y="416" text-anchor="middle" class="bk3-scene-label" font-size="14">cm</text>

              <line x1="164" y1="108" x2="164" y2="330" stroke="#4e32e8" stroke-width="7" stroke-linecap="round"></line>
              <path d="M145 310 L164 338 L183 310" fill="none" stroke="#4e32e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle cx="164" cy="96" r="7" fill="#4e32e8"></circle>
              <text id="dropValueText" x="164" y="365" text-anchor="middle" fill="#4e32e8" font-size="17" font-weight="700"></text>

              <rect class="bk3-callout-box" x="30" y="28" width="142" height="32"></rect>
              <text x="101" y="50" text-anchor="middle" class="bk3-scene-label" font-size="15">Drop height</text>
              <path class="bk3-callout-line" d="M101 60 V69"></path>
            </g>

            <!-- Ball and comparison condition -->
            <g class="bk3-diagram-part" data-part="ball">
              <g class="bk3-motion-ghost">
                <circle cx="286" cy="205" r="44" fill="#ffc91c"></circle>
                <circle cx="286" cy="290" r="38" fill="#ffc91c"></circle>
              </g>

              <circle id="mainBall" cx="286" cy="120" r="52" fill="url(#ballGradient)" stroke="#30332f" stroke-width="5" filter="url(#softShadow)"></circle>
              <ellipse cx="269" cy="102" rx="15" ry="10" fill="#fff" opacity="0.5" transform="rotate(-25 269 102)"></ellipse>
              <path d="M247 91 Q286 123 325 91" fill="none" stroke="#30332f" stroke-width="3.5"></path>
              <path d="M247 149 Q286 117 325 149" fill="none" stroke="#30332f" stroke-width="3.5"></path>

              <g id="comparisonBallGroup" hidden>
                <circle id="comparisonBall" cx="424" cy="122" r="34" fill="url(#ballGradient)" stroke="#30332f" stroke-width="4" filter="url(#smallShadow)"></circle>
                <ellipse cx="414" cy="113" rx="9" ry="6" fill="#fff" opacity="0.5" transform="rotate(-25 414 113)"></ellipse>
                <rect class="bk3-callout-box" x="373" y="171" width="102" height="30"></rect>
                <text x="424" y="191" text-anchor="middle" class="bk3-scene-label" font-size="13">Comparison</text>
              </g>

              <rect class="bk3-callout-box" x="230" y="28" width="112" height="32"></rect>
              <text x="286" y="50" text-anchor="middle" class="bk3-scene-label" font-size="15">Test ball</text>
              <path class="bk3-callout-line" d="M286 60 V68"></path>
            </g>

            <!-- Straight bounce trajectory and measurement -->
            <g class="bk3-diagram-part" data-part="bounce">

            <!-- Straight upward bounce arrow -->
            <line
                x1="365"
                y1="411"
                x2="365"
                y2="185"
                stroke="#00a867"
                stroke-width="9"
                stroke-linecap="round">
            </line>

            <!-- Upward arrowhead -->
            <path
                d="M345 210 L365 178 L385 210"
                fill="none"
                stroke="#00a867"
                stroke-width="9"
                stroke-linecap="round"
                stroke-linejoin="round">
            </path>

            <!-- Straight vertical ghost-ball positions -->
            <circle
                class="bk3-motion-ghost"
                cx="365"
                cy="350"
                r="25"
                fill="#00c77a">
            </circle>

            <circle
                class="bk3-motion-ghost"
                cx="365"
                cy="285"
                r="20"
                fill="#00c77a">
            </circle>

            <circle
                class="bk3-motion-ghost"
                cx="365"
                cy="225"
                r="16"
                fill="#00c77a">
            </circle>

            <!-- Bounce-height measurement guide -->
            <line
                class="bk3-measure-guide"
                x1="494"
                y1="181"
                x2="494"
                y2="416">
            </line>

            <line
                x1="483"
                y1="181"
                x2="505"
                y2="181"
                stroke="#4e32e8"
                stroke-width="3">
            </line>

            <line
                x1="483"
                y1="416"
                x2="505"
                y2="416"
                stroke="#4e32e8"
                stroke-width="3">
            </line>

            <text
                id="measureValueText"
                x="495"
                y="309"
                text-anchor="middle"
                fill="#4e32e8"
                font-size="15"
                font-weight="700"
                transform="rotate(-90 495 309)">
            </text>

            <!-- Measurement callout -->
            <rect
                class="bk3-callout-box"
                x="425"
                y="70"
                width="158"
                height="34">
            </rect>

            <text
                x="504"
                y="93"
                text-anchor="middle"
                class="bk3-scene-label"
                font-size="15">
                Measured result
            </text>

            <path
                class="bk3-callout-line"
                d="M504 104 V118 L494 145">
            </path>
            </g>

            <!-- Changeable test surface -->
            <g class="bk3-diagram-part" data-part="surface">
              <rect id="surfaceRect" x="185" y="416" width="330" height="50" rx="10" fill="url(#surfaceGradient)" stroke="#30332f" stroke-width="5" filter="url(#smallShadow)"></rect>
              <path d="M205 441 H495" stroke="#30332f" stroke-width="2.4" stroke-dasharray="10 8" opacity="0.55"></path>
              <text id="surfaceLabel" x="350" y="447" text-anchor="middle" fill="#30332f" font-size="17" font-weight="700">Bounce surface</text>
              <rect class="bk3-callout-box" x="208" y="474" width="284" height="30"></rect>
              <text x="350" y="494" text-anchor="middle" class="bk3-scene-label" font-size="14">Keep this surface consistent for every trial</text>
            </g>
          </svg>
        </div>

        <div class="bk3-choice-preview" id="choicePreview" aria-live="polite"></div>
      </aside>

      <section class="bk3-panel">
        <div class="bk3-planner-heading">
          <h2>Investigation planner</h2>
          <p>Complete one part at a time. Your choices stay visible in the experiment diagram.</p>
        </div>

        <div id="plannerRoot"></div>

        <div class="bk3-feedback" id="plannerFeedback" hidden></div>

        <div class="bk3-actions">
          <button type="button" class="bk3-button secondary" id="backButton">Back</button>
          <button type="button" class="bk3-button reset" id="resetButton">Reset</button>
          <button type="button" class="bk3-button" id="nextButton">Next</button>
        </div>
      </section>
    </div>
  </main>

  <script src="../scripts/common_functions.js"></script>
  <script src="../scripts/lesson2_scripts/bigkahuna3.js"></script>
</body>
</html>
